name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage -w packages/engine
      - run: npm run build

  # The in-process PGlite tests cannot open a second connection, so row locking, concurrency, the
  # append-only triggers, role privileges and the sign-up hook are also exercised against a real
  # server. With TEST_DATABASE_URL set, `openTestDb` gives each suite throwaway databases on this
  # server instead of PGlite, so the ledger, profiles, migrations and privileges suites run here
  # too. Runs in parallel with `gate`; every test creates and drops its own database.
  postgres:
    name: real Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run --project web
          apps/web/src/db/postgres.integration.test.ts
          apps/web/src/db/postgres.concurrency.integration.test.ts
          apps/web/src/db/test-db.test.ts
          apps/web/src/db/migrations.test.ts
          apps/web/src/db/privileges.test.ts
          apps/web/src/server/ledger.test.ts
          apps/web/src/server/profiles.test.ts
          apps/web/src/server/trading.concurrency.integration.test.ts
